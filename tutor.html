<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель тьютора</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>👩‍🏫 Панель тьютора</h1>
    <nav>
      <a href="plan.html" class="tutor-link">График</a>
      <a href="index.html" class="tutor-link">← К ученику</a>
    </nav>
  </header>

  <main id="tutor-app">
    <section>
      <h2>Сегодня по графику</h2>
      <div id="tutor-today"></div>
    </section>

    <section>
      <h2>Календарь: уроки и темы</h2>
      <p class="hint">По числам: что проходим и какая тема. Зелёным — уже усвоено на этом компьютере.</p>
      <div id="tutor-calendar"></div>
    </section>

    <section>
      <h2>Прогресс по блокам</h2>
      <p class="hint">🔴 не усвоено после двух проверок · 🟡 в процессе · 🟢 усвоено</p>
      <div id="tutor-progress"></div>
    </section>

    <section>
      <h2>Последние ошибки</h2>
      <div id="tutor-errors"></div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    renderTutorPanel();
  </script>
</body>
</html>
